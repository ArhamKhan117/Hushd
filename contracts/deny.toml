# cargo deny settings for the contracts workspace (`pnpm security`).

[graph]
# what ships is the wasm32 build; host tools and tests are checked as well
all-features = false

[advisories]
ignore = [
    # crypto-bigint 0.5.5: only in near-sdk's host-side test VM, never in a contract's wasm (see .cargo/audit.toml)
    { id = "RUSTSEC-2026-0387", reason = "host-only test VM dependency of near-sdk, not in any contract wasm" },
    # wee_alloc is near-sdk's wasm allocator; unmaintained, no known vulnerability
    { id = "RUSTSEC-2022-0054", reason = "near-sdk's allocator; unmaintained, no vulnerability" },
    # unsafe-libyaml comes with near-parameters in near-sdk's host-side test VM
    { id = "RUSTSEC-2024-0449", reason = "host-only test VM dependency of near-sdk; unmaintained, no vulnerability" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
